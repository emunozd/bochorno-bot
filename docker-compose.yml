services:

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bochorno-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_DB: /data/bot.db
      TZ: America/New_York
    volumes:
      - /var/lib/bochorno-bot/data:/data
    networks:
      - bochorno_net
    stdin_open: true
    tty: true

networks:
  bochorno_net:
    name: bochorno_net
    driver: bridge